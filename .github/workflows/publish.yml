name: Publish runner image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [controller, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.component }}
        uses: ./.github/actions/build-runner-artifact
        with:
          component: ${{ matrix.component }}

  image:
    needs: [tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-*-artifact
          path: ${{ runner.temp }}/runner-artifacts
      - name: Publish runner image
        uses: ./.github/actions/publish-runner-image
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
