name: Publish runner image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # TrueNAS runs the pool image. start-pool.sh imports the worker
          # archive into the private Docker Engine at startup.
          target: pool
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=runner-pool
          cache-to: type=gha,scope=runner-pool,mode=max,ignore-error=true
