version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/build-runner-artifact
      - /.github/actions/publish-runner-image
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
