name: Publish runner image
description: Build and publish the final pool image from runner artifacts
inputs:
  registry-username:
    description: Container registry username
    required: true
  registry-password:
    description: Container registry password
    required: true
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
    - id: image
      shell: bash
      run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        target: pool
        platforms: linux/amd64
        build-contexts: |
          controller-artifact=${{ runner.temp }}/runner-artifacts/runner-controller-artifact
          worker-artifact=${{ runner.temp }}/runner-artifacts/runner-worker-artifact
        push: true
        tags: ${{ steps.image.outputs.tag }}
