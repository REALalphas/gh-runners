[package]
name = "gh-runner-pool"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
jsonwebtoken = "10.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
